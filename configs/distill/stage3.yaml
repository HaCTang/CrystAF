# AnyFlow distillation, stage 3 of 4. Reported run: 7 GPUs (DDP).

checkpoint: checkpoints/clari-med.ckpt
clari_nft_init: checkpoints/crystaf/teacher-rank800-pbnft-epoch1.pt
use_ema_init: true
meanflow_steps: 16
enable_chiral: false
enantiomer_flip_p: 0.0
chiral_loss_weight: 0.0
loss_type: anyflow
anyflow_variant: official
gate_value: 0.25
time_parameterization: clari_forward
deltatime_type: r
student_tune: delta_lora
lora_rank: 32
lora_alpha: 64.0
anyflow_diffusion_ratio: 0.5
anyflow_consistency_ratio: 0.0
anyflow_weight_type: uniform
anyflow_weight_grid_size: 1000
anyflow_cd_eps: 0.005
anyflow_v_target_source: teacher
anyflow_cd_velocity_source: teacher
anyflow_jvp_source: student
anyflow_nfe_steps: 16
anyflow_loss_v_weight: 0.0
embed_deltat_lr_mult: 4.0
time_residual: 0.0
endpoint_mix: 0.0
clari_data_dir: dataset/clari
require_csd: true
use_mcf: false
mcf_sample_prob: 0.0
batch_size: 16
num_workers: 2
prefetch_factor: 2
grad_accum: 2
num_epochs: 4
steps_per_epoch: 1000
max_steps: 2000
lr: 1.0e-05
weight_decay: 0.0
lr_warmup_steps: 50
max_grad_norm: 1.0
fm_warmup_steps: 0
ratio_r_not_equal_t: 0.75
aux_vol_weight: 0.0
aux_ldd_weight: 0.0
use_aux_losses: false
ema_decay: 0.999
log_every: 20
save_every_steps: 500
save_every_n_epochs: 4
eval_every_n_epochs: 0
eval_at_epochs: []
eval_after_train: false
keep_last_n_step_ckpts: 4
keep_last_n_epoch_ckpts: 1
baseline_eval_every_steps: 0
eval_table1_nproc: 7
eval_table1_pack_size: 8
eval_table1_samples: 20
save_dir: runs/distill_s3
resume_from: runs/distill_s2/checkpoint-step2000.pt
reset_embed_deltat_on_resume: false
reset_step_on_resume: true
seed: 44
bf16: true
