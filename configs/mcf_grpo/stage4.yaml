# GRPO baseline on MolCrystalFlow (same reward), stage 4 (final).
# Reported run: 4 GPUs.

ckpt_path: CrystalGenModel/MolCrystalFlow/model-checkpoints/thurlemann23/best.ckpt
molecules_manifest: dataset/molcrystalflow/nft_molecules/molecules.json
resume_ckpt: runs/mcf_grpo_stage3/checkpoint-epoch11.pt
start_epoch: 12
num_epochs: 13
steps_per_epoch: 800
samples_per_mol: 24
inner_epochs: 1
train_batch_size: 8
z_value: 4
has_axis_flip: false
num_timesteps: 50
scaling: 9.0
exp_rate: 3.0
sampling_batch_size: 8
async_sample_prefetch: true
lr: 7.0e-08
weight_decay: 0.0
max_grad_norm: 0.5
clip_range: 0.2
grpo_tau: 1.0
kl_coef: 0.03
decay_type: 1
ef_lambda: 0.4
advantage_clip: 5.0
adv_mode: continuous
w_clash: 1.0
w_fmax: 0.0
w_stress: 0.0
w_volume: 2.5
project_volume_targets: false
volume_projection_strength: 0.0
projection_positive_only: true
train_lattice_only: false
uma_model: uma-s-1p1
uma_ckpt_path: checkpoints/uma/uma-s-1p1.pt
uma_batch_size: 16
use_ultrafast: false
sync_timeout_s: 86400
save_dir: runs/mcf_grpo_stage4
save_every: 1
seed: 67
