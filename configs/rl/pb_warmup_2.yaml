# Stage-2 RL warm-up, part 2: resume part 1 for 4 more epochs
# (runs/rl_pb_warmup_2/checkpoint-nft-epoch4.pt). Reported run: 4 GPUs.

checkpoint: checkpoints/clari-med.ckpt
meanflow_ckpt: checkpoints/crystaf/crystaf-cont3-step2000.pt
resume_nft: runs/rl_pb_warmup_1/checkpoint-nft-epoch8.pt
device: cuda
enable_chiral: false
clari_data_dir: dataset/clari
require_csd: true
num_epochs: 4
steps_per_epoch: 50
samples_per_mol: 24
train_batch_size: 4
inner_epochs: 1
lr: 2.0e-05
weight_decay: 0.0001
max_grad_norm: 1.0
beta: 0.1
kl_coef: 0.0001
meanflow_steps: 16
sampler_mode: interval
sampler_rho: 0.75
sampler_schedule: power
sample_batch_size: 12
nft_velocity_mode: instantaneous
cd_velocity_source: noise_minus_data
nft_diffusion_ratio: 0.5
nft_consistency_ratio: 0.0
nft_nfe_steps: 16
nft_grid_rho: 0.75
nft_cd_eps: 0.005
nft_share_cd_with_old: true
nft_student_tune: delta_lora
lora_rank: 32
lora_alpha: 64.0
forward_anchor_weight: 0.0
use_ema: true
ema_decay: 0.999
anyflow_use_aux_losses: false
anyflow_aux_vol_weight: 0.0
anyflow_aux_ldd_weight: 0.0
uma_model: uma-s-1p1
uma_ckpt_path: checkpoints/uma/uma-s-1p1.pt
use_ultrafast: false
ef_lambda: 0.5
advantage_clip: 1.0
adv_mode: pb_rank
reward_mode: pb
top_frac: 0.25
bottom_frac: 0.25
clash_veto_positive: true
skip_flat_pb: false
min_pb_range: 1.0e-06
max_family_tries: 4
drop_neutral_r: true
w_clash: 0.0
w_fmax: 0.0
w_stress: 0.25
w_alignment: 1.0
w_volume: 0.0
w_pb: 1.0
align_pdd_weight: 1.0
align_xrd_weight: 1.0
align_volume_weight: 1.0
uma_batch_size: 8
save_dir: runs/rl_pb_warmup_2
save_every: 1
seed: 141
vol_rank_weight: 1.0
