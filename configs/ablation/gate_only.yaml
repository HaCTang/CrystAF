# Matched post-training arm: starts from CrystAF-base and differs from full.yaml
# only in the fields named here. Reported run: 4 GPUs; read at epoch 4 (appendix: 6).
# Eligibility gate only: all UMA channels and volume off, 4 epochs.

checkpoint: checkpoints/clari-med.ckpt
meanflow_ckpt: checkpoints/crystaf/crystaf-cont3-step2000.pt
resume_nft: null
device: cuda
enable_chiral: false
meanflow_steps: 16
sampler_mode: interval
sampler_rho: 0.75
sampler_schedule: power
sample_batch_size: 12
clari_data_dir: dataset/clari
require_csd: true
reward_mode: uma
adv_mode: continuous
max_family_tries: 4
advantage_clip: 1.0
w_pb: 1.0
w_clash: 1.0
top_frac: 0.25
bottom_frac: 0.25
clash_veto_positive: true
skip_flat_pb: false
drop_neutral_r: true
vol_rank_weight: 1.0
clash_rank_weight: 0.0
nft_velocity_mode: instantaneous
cd_velocity_source: noise_minus_data
nft_diffusion_ratio: 0.0
nft_consistency_ratio: 0.0
nft_nfe_steps: 8
nft_grid_rho: 0.75
nft_cd_eps: 0.005
nft_share_cd_with_old: true
nft_student_tune: delta_lora
lora_rank: 32
lora_alpha: 64.0
num_epochs: 4
steps_per_epoch: 20
samples_per_mol: 100
inner_epochs: 1
train_batch_size: 4
lr: 5.0e-06
weight_decay: 0.0001
max_grad_norm: 1.0
beta: 0.1
kl_coef: 0.0001
forward_anchor_weight: 0.0
use_ema: true
ema_decay: 0.999
save_dir: runs/ablation_gate_only
save_every: 1
seed: 929
ef_lambda: 0.5
w_fmax: 0.0
w_stress: 0.0
w_volume: 0.0
w_alignment: 0.0
align_pdd_weight: 0.0
align_xrd_weight: 0.0
align_volume_weight: 0.0
uma_model: uma-s-1p1
uma_ckpt_path: checkpoints/uma/uma-s-1p1.pt
uma_batch_size: 4
use_ultrafast: false
w_e: 0.0
w_f: 0.0
