# UMA-reward NFT on MolCrystalFlow, stage 1 (part a).
# Reported run: 4 GPUs.

ckpt_path: CrystalGenModel/MolCrystalFlow/model-checkpoints/thurlemann23/best.ckpt
molecules_manifest: dataset/molcrystalflow/nft_molecules/molecules.json
num_epochs: 4
steps_per_epoch: 800
samples_per_mol: 12
inner_epochs: 1
train_batch_size: 4
z_value: 4
has_axis_flip: false
num_timesteps: 50
scaling: 9.0
exp_rate: 3.0
lr: 1.0e-06
weight_decay: 0.0
max_grad_norm: 1.0
beta: 0.1
kl_coef: 0.01
decay_type: 1
ef_lambda: 0.2
advantage_clip: 5.0
adv_mode: continuous
w_clash: 1.0
w_fmax: 0.0
w_stress: 0.0
w_volume: 4.0
uma_model: uma-s-1p1
uma_ckpt_path: checkpoints/uma/uma-s-1p1.pt
uma_batch_size: 4
use_ultrafast: false
sync_timeout_s: 86400
save_dir: runs/mcf_nft_stage1a
save_every: 1
seed: 0
