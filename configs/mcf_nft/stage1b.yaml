# UMA-reward NFT on MolCrystalFlow, stage 1 (part b).
# Reported run: 4 GPUs.

ckpt_path: CrystalGenModel/MolCrystalFlow/model-checkpoints/thurlemann23/best.ckpt
molecules_manifest: dataset/molcrystalflow/nft_molecules/molecules.json
resume_ckpt: runs/mcf_nft_stage1a/checkpoint-epoch3.pt
start_epoch: 4
num_epochs: 7
steps_per_epoch: 1000
samples_per_mol: 24
inner_epochs: 1
train_batch_size: 8
z_value: 4
has_axis_flip: false
num_timesteps: 50
scaling: 9.0
exp_rate: 3.0
lr: 5.0e-07
weight_decay: 0.0
max_grad_norm: 1.0
beta: 0.1
kl_coef: 0.02
decay_type: 1
ef_lambda: 0.15
advantage_clip: 5.0
adv_mode: continuous
w_clash: 0.5
w_fmax: 0.0
w_stress: 0.0
w_volume: 5.0
uma_model: uma-s-1p1
uma_ckpt_path: checkpoints/uma/uma-s-1p1.pt
uma_batch_size: 8
use_ultrafast: false
sync_timeout_s: 86400
save_dir: runs/mcf_nft_stage1b
save_every: 1
seed: 17
