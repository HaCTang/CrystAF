[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-nft"
version = "1.0.0"
description = "CrystAF: physics-aligned negative-aware fine-tuning for molecular crystal generators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/crystal_nft/tests"]
